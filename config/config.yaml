# Kraken Momentum Trader Configuration
# WARNING: Start with paper_trading: true and validate strategy before using real capital

trading:
  pairs: ["BTC/USD", "ETH/USD", "XRP/USD", "SOL/USD", "DOGE/USD", "ADA/USD", "AVAX/USD"]
  check_interval_seconds: 60
  paper_trading: true  # CRITICAL: Keep true until strategy validated over 2+ weeks
  paper_trading_capital: 10000.0  # Starting capital for paper trading simulation

strategy:
  name: "momentum"
  momentum_threshold: 0.005  # Aggressive: lower bar to capture more momentum moves
  min_expected_gain: 0.003   # Aggressive: capture smaller profitable moves

  # RSI Configuration — optimizer-validated aggressive settings
  rsi_period: 14
  rsi_oversold: 45   # Optimized: below neutral but above classic 30 for more entries
  rsi_overbought: 65  # Optimized: exit earlier to lock in gains before reversal

  # EMA Configuration
  ema_short_period: 9   # Faster EMA for quicker crossover signals
  ema_long_period: 21   # Tighter long EMA for more responsive trend detection

  # Volume Configuration
  volume_sma_period: 20
  volume_threshold: 1.0  # Optimized: require at least average volume (real confirmation)

risk:
  # Position Limits
  max_position_size_usd: 5000
  max_position_percent: 45.0  # Increased from 40% for larger initial positions
  max_total_exposure_percent: 200.0  # Full Martingale pyramiding capacity

  # Trailing Stop Configuration — optimized for max return capture
  use_trailing_stop: true
  trailing_stop_percent: 3.0   # Tight: lock gains fast, reduce giveback
  trailing_stop_activation_percent: 2.0  # Activate early: start protecting at 2% profit
  initial_stop_loss_percent: 8.0  # Safety net: hard stop at 8% loss (was disabled!)

  # Martingale Configuration — aggressive pyramiding for max returns
  martingale:
    enabled: true
    max_entries: 5            # 4→5: more add-on opportunities in deep dips
    size_multiplier: 1.3      # 1.25→1.3: larger position adds for faster recovery
    add_on_drop_percent: 4.0  # 5%→4%: trigger adds sooner for quicker cost averaging
    require_rsi_oversold: true  # Keep RSI gate for quality adds
    require_ema_trend: false    # Don't require EMA (allows adds in temporary dips)

  # Circuit Breaker — tighter safety with faster recovery
  circuit_breaker_consecutive_losses: 4  # 5→4: stop sooner on losing streaks
  circuit_breaker_cooldown_hours: 1      # 2→1: recover faster after cooldown

exchange:
  name: "kraken"
  api_version: "0"
  rate_limit_calls_per_minute: 15
  retry_attempts: 3
  retry_delay_seconds: 2

persistence:
  type: "sqlite"  # "sqlite" recommended, "file" for legacy JSON
  db_path: "data/trading.db"

logging:
  level: "INFO"
  format: "json"  # "json" for production, "text" for development
  include_timestamps: true

notifications:
  discord:
    enabled: true
    webhook_url: ""  # Set via DISCORD_WEBHOOK_URL environment variable
  daily_summary:
    enabled: true
    hour: 17  # 5 PM
    minute: 0
    timezone: "America/New_York"

# Machine Learning Signal Enhancement
ml:
  enabled: true
  confidence_threshold: 0.45  # Optimized: balanced filter (0.1 was disabled, 0.6 too strict)
  model_dir: "data/ml/models"

  # Auto-retraining triggers — more responsive
  retrain_after_trades: 30    # 50→30: retrain sooner on fresh data
  min_samples_for_retrain: 75  # 100→75: allow retraining with less data
  performance_threshold: 0.45  # 0.4→0.45: retrain earlier when performance dips
  check_interval_seconds: 1800  # 3600→1800: check every 30min instead of 1hr
