# Scalping Strategy Configuration (v6 — 730-day Kraken CSV OOS Validated)
# Enhanced with: Stochastic, MACD, OBV, ATR dynamic stops, short selling
# Optimized using 730 days of 4h Kraken OHLCVT data with 70/30 OOS validation
#
# Optimization results (730 days, 4h candles, 150 trials, Kraken CSV data):
#   ATOM/USD:  +32.90% (71.4% WR, 158 trades, PF 3.06)  *** TOP ***
#   SOL/USD:   +31.50% (77.1% WR, 238 trades, PF 2.15)  *** TOP ***
#   NEAR/USD:  +29.23% (63.6% WR, 120 trades, PF 2.58)  *** TOP ***
#   AVAX/USD:  +24.91% (66.7% WR, 198 trades, PF 2.01)
#   POL/USD:   +20.59% (66.7% WR, 128 trades, PF 3.06)
#   LINK/USD:  +19.98% (60.0% WR, 152 trades, PF 2.00)
#   DOT/USD:   +19.59% (87.5% WR,  55 trades, PF 10.26)
#   ETH/USD:   +11.25% (60.7% WR,  90 trades, PF 1.91)
#   XRP/USD:    +9.13% (70.6% WR,  60 trades, PF 2.43)
#   BTC/USD:    +5.60% (73.3% WR,  66 trades, PF 5.59)
#
# All 10 pairs profitable. Data source: Kraken official OHLCVT CSVs (2024-2025).
# Strategy: 8-indicator confirmation with long+short support
# Entry: Buy when N signals confirm oversold, Short when N+ confirm overbought
# Exit: ATR-based dynamic TP/SL, or indicator reversal

strategy:
  name: "scalping"

  # Default parameters (fallback when per-pair not specified)
  take_profit_percent: 4.5    # Static fallback — ATR dynamic TP preferred
  stop_loss_percent: 2.5      # Static fallback — ATR dynamic SL preferred
  candle_interval: 240        # 4-hour candles
  min_confirmations: 3        # Minimum confirmations for long entry

# Core oscillators
indicators:
  rsi:
    period: 10
    oversold: 28.0
    overbought: 70.0

  stochastic:
    k_period: 13
    d_period: 3
    oversold: 23.0
    overbought: 75.0

  macd:
    fast_period: 12
    slow_period: 26
    signal_period: 9

  bollinger:
    period: 20
    std_dev: 2.0
    squeeze_threshold: 3.0

  vwap:
    threshold_percent: 0.5

  volume:
    spike_threshold: 1.5

  obv:
    sma_period: 20

  atr:
    period: 14
    stop_multiplier: 2.5      # Dynamic SL = 2.5 x ATR
    tp_multiplier: 2.75       # Dynamic TP = 2.75 x ATR
    use_dynamic_stops: true   # Use ATR-based stops instead of static %

# Short selling configuration
shorting:
  enabled: true
  min_confirmations: 3        # Shorts need more confirmation than longs

# Trading pairs — ordered by 730-day OOS-validated performance
pairs:
  - ATOM/USD   # TOP — +32.90%, PF 3.06, 158 trades
  - SOL/USD    # TOP — +31.50%, PF 2.15, 238 trades
  - NEAR/USD   # TOP — +29.23%, PF 2.58, 120 trades
  - AVAX/USD   # STRONG — +24.91%, PF 2.01, 198 trades
  - POL/USD    # STRONG — +20.59%, PF 3.06, 128 trades
  - LINK/USD   # STRONG — +19.98%, PF 2.00, 152 trades
  - DOT/USD    # STRONG — +19.59%, PF 10.26, 55 trades
  - ETH/USD    # VIABLE — +11.25%, PF 1.91, 90 trades
  - XRP/USD    # VIABLE — +9.13%, PF 2.43, 60 trades
  - BTC/USD    # VIABLE — +5.60%, PF 5.59, 66 trades

