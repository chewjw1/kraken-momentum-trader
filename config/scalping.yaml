# Scalping Strategy Configuration (v13 — rollover fidelity + session VWAP)
#
# v13 changes (June 2026):
#   - MARGIN ROLLOVER now modeled in paper/replay (fees.margin_rollover_
#     percent_4h): shorts cost ~0.02%/4h, which live pays the exchange but the
#     sim previously ignored — overstating short P&L by ~$906 across 4 quarters.
#     Honest baseline dropped +$4,736 -> +$3,830 (the hidden carry cost).
#   - SESSION VWAP (indicators.vwap.anchor_candles: 6): VWAP now anchors to one
#     calendar day instead of a ~90-day cumulative average, restoring it as an
#     intraday mean-reversion level. +$453 over honest baseline, improves 3/4
#     quarters including both losers. RSI/Stoch dedup was tested and REJECTED
#     (-$1,235, wrecked Q1'25).
#   - SIDEWAYS short block (regime_detector.block_short_regimes): A/B settled
#     "should we sit out chop?" — no. Sitting out loses money (the strategy
#     already profits from ranges via mean-reversion). The win is dropping the
#     weak side: shorts in sideways (+$239, 0 regressions). Bear shorts kept.
#
# v13 honest baselines (replay, $10k, rollover ON, cooldown 10):
#   Q4 2024 +$1,726 | Q1 2025 -$166 | Q1 2026 +$3,331 | Q2 2026 -$370
#   TOTAL +$4,522
#
# v12 changes (June 2026):
#   - LIVE order lifecycle (see `live:` section): maker fill management with
#     timeout/cancel/market-fallback, partial-fill handling, post-only
#     rejection retries, server-side disaster stops, startup reconciliation
#     against exchange state, periodic drift alerts, AddOrder idempotency
#     protection (userref-tagged orders, no blind network retries).
#     All lifecycle behavior is gated on --live; paper mode is byte-identical
#     to v11 with cooldown disabled (replay parity verified to the cent).
#   - Regime-flip entry cooldown (10 candles): +$1,603 across 4 quarters,
#     improves 3/4. See regime_detector.flip_entry_cooldown_candles.
#
# v12 validated baselines (integrated replay, $10k, cooldown 10):
#   Q4 2024 +$1,405 | Q1 2025 -$217 | Q1 2026 +$3,836 | Q2 2026 -$287
#
# Previous: (v11 — Q2 2026 OOS-validated, config hygiene)
# Enhanced with: Stochastic, MACD, OBV, ATR dynamic stops, short selling,
#   doji candle filter, disaster stop, trailing stops (available but disabled)
#
# v11 changes (June 2026):
#   - Q2 2026 out-of-sample validation (Apr 1 - Jun 10, pristine data fetched
#     after all parameters were chosen; full bull leg $68k->$82.5k then bear
#     leg to $60k): replay +$264 (+2.6%), live-fidelity -$630. Roughly
#     breakeven through a brutal whipsaw quarter.
#   - Retrain attempt on 3 quarters (Q4'24+Q1'25+Q1'26) validated against Q2:
#     REJECTED. Full 4-pair candidate set cost -$3,041 across 4 quarters in
#     integrated replay (loosened confirmation gates -> excess trading, same
#     failure mode as v10 candidates). Best subset (+$150/4qtrs) was inside
#     the +/-$1k phase-noise band. Params are at their data-supported optimum.
#   - Config hygiene: removed dead circuit_breaker section and
#     order_timeout_seconds; wired previously-dead knobs (ema_filter
#     bearish_threshold, trailing trail_trigger/lock_pct, position
#     confidence_scaling/min/max_scale, regime check_every_candles) —
#     all values match previous hardcodes, behavior-neutral (replay parity
#     verified to the penny).
#   - check_interval 90s -> 60s: faster disaster-stop reaction; entries and
#     normal exits are candle-anchored so decision counts are unaffected.
#
# Validated baselines (integrated replay, $10k, disaster stop 10%):
#   Q4 2024 +$1,068 | Q1 2025 -$1,233 | Q1 2026 +$3,035 | Q2 2026 +$264
# Realistic (live-fidelity, next-open fills):
#   Q1 2026 +$1,777 | Q2 2026 -$630
strategy:
  name: "scalping"

  # Default candle interval (overridden per-pair where needed)
  candle_interval: 240        # 4-hour candles (default)
  take_profit_percent: 4.5    # Static fallback — ATR dynamic TP preferred
  stop_loss_percent: 2.5      # Static fallback — ATR dynamic SL preferred
  min_confirmations: 3        # Minimum confirmations for long entry

# Core oscillators (defaults)
indicators:
  rsi:
    period: 10
    oversold: 28.0
    overbought: 70.0

  stochastic:
    k_period: 13
    d_period: 3
    oversold: 23.0
    overbought: 75.0

  macd:
    fast_period: 12
    slow_period: 26
    signal_period: 9

  bollinger:
    period: 20
    std_dev: 2.0
    squeeze_threshold: 3.0

  vwap:
    threshold_percent: 0.5
    # Session anchor: compute VWAP over the last N candles instead of the full
    # ~540-candle lookback. 0 = old cumulative behavior (a ~90-day VW average
    # that acts as a slow trend filter, not a session reference). 6 = one
    # calendar day on 4h candles — the textbook daily-VWAP anchor, which
    # restores VWAP as an intraday mean-reversion level.
    #   anchor   Q4'24    Q1'25    Q1'26    Q2'26    TOTAL
    #   0 (base) +1337    -498     +3495    -504     +3830
    #   5        +1923    -308     +3358    +132     +5105   (overfit: see below)
    #   6 (day)  +1726    -166     +3092    -370     +4283
    #   8        +1341    -259     +2516    -3       +3595
    #   14       +1473    -353     +2254    -405     +2970
    # 6 chosen as the principled daily anchor (+$453, improves 3/4 incl. both
    # losing quarters). 5 scores higher but adjacent values swing ~$1.5k
    # (8 is below baseline) — a knife-edge in-sample optimum, rejected as
    # overfit per the same discipline used on param retrains.
    anchor_candles: 6

  volume:
    spike_threshold: 1.5

  obv:
    sma_period: 20

  atr:
    period: 14
    stop_multiplier: 2.5
    tp_multiplier: 2.75
    use_dynamic_stops: true

# Trailing stops — disabled because current params were optimized without them.
# Enable for backtesting/optimization experiments only.
trailing_stops:
  enabled: false          # Set true to activate trailing stop logic
  trail_trigger_pct: 0.5  # Start trailing at 50% of TP progress
  trail_lock_pct: 0.5     # Lock in 50% of peak unrealized profit

# LIVE order lifecycle (only read when running with --live; paper fills are
# instant and use none of this)
live:
  # Maker (post-only) orders rest on the book. Wait this long for a fill,
  # polling every fill_poll_seconds, before cancelling the remainder.
  fill_timeout_seconds: 120
  fill_poll_seconds: 5
  # Unfilled ENTRY after timeout: chase with a market order (taker 0.26% vs
  # maker 0.16%). The strategy's per-trade edge dwarfs the 0.1% fee delta, so
  # missing a validated entry costs more than paying taker. EXITS always fall
  # back to market — never stay in a position you decided to leave.
  entry_fallback_to_market: true
  # Post-only orders are rejected when price crosses our limit between ticker
  # fetch and placement; each retry re-prices at the fresh bid/ask.
  max_postonly_retries: 2
  # Rest a stop-loss on the EXCHANGE at the disaster-stop level (10%) so
  # positions are protected through process crashes and seedbox outages.
  # Normal exits remain the validated in-process candle logic.
  server_side_disaster_stop: true
  # Startup reconciliation: margin shorts found on the exchange that the
  # state file doesn't know about are flattened (they bleed ~0.02%/4h
  # rollover and carry unmonitored risk). Margin positions can only have come
  # from this bot; manual spot holdings are never touched.
  flatten_unknown_margin: true
  # Cancel resting orders tagged with our userref at startup (a dead process
  # leaves maker orders and stops on the book). Manual orders are untouched.
  cancel_stale_orders_on_start: true
  # Read-only state-vs-exchange comparison every N cycles (~minutes at 60s
  # check interval); logs CRITICAL on divergence.
  drift_check_every_cycles: 60

# Short selling configuration
shorting:
  enabled: true
  min_confirmations: 3
  # Kraken spot shorts are margin orders; the exchange requires leverage >= 2
  # to open one. Position SIZE is unchanged (volume is set by the strategy) —
  # leverage only determines collateral. NOTE: Kraken charges a margin
  # rollover fee (~0.02% per 4h) on open margin positions; neither paper
  # trading nor replay models it, so multi-day shorts cost ~0.12%/day more
  # in live than simulated.
  leverage: 2

