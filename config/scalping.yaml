# Scalping Strategy Configuration (v10 — Re-trained with corrected execution)
# Enhanced with: Stochastic, MACD, OBV, ATR dynamic stops, short selling,
#   doji candle filter, trailing stops (available but disabled)
#
# v10 changes:
#   - Re-trained risk/reward params (TP, SL, ATR mults, confirmations) with
#     corrected execution model (one-decision-per-candle, proper 12h aggregation)
#   - Training: Q4 2024 + Q1 2025 (6 months)
#   - Forward validation: Q1 2026 fresh Kraken data (held out, 3 months)
#   - 3 x 12h pairs adopted new params (AVAX, ATOM, POL) — most affected by
#     12h aggregation correction that was the main execution fix
#   - 7 pairs kept v9 params (4h pairs + SOL/LINK/NEAR)
#   - Indicator periods (RSI, stoch, BB, etc.) locked at v9 values
#
# Integrated replay results (Q1 2026 fresh, $10k shared capital):
#   +$2,667 (+26.67%), 99 trades, 60.6% WR (was +$2,291 with v9 params)
strategy:
  name: "scalping"

  # Default candle interval (overridden per-pair where needed)
  candle_interval: 240        # 4-hour candles (default)
  take_profit_percent: 4.5    # Static fallback — ATR dynamic TP preferred
  stop_loss_percent: 2.5      # Static fallback — ATR dynamic SL preferred
  min_confirmations: 3        # Minimum confirmations for long entry

# Core oscillators (defaults)
indicators:
  rsi:
    period: 10
    oversold: 28.0
    overbought: 70.0

  stochastic:
    k_period: 13
    d_period: 3
    oversold: 23.0
    overbought: 75.0

  macd:
    fast_period: 12
    slow_period: 26
    signal_period: 9

  bollinger:
    period: 20
    std_dev: 2.0
    squeeze_threshold: 3.0

  vwap:
    threshold_percent: 0.5

  volume:
    spike_threshold: 1.5

  obv:
    sma_period: 20

  atr:
    period: 14
    stop_multiplier: 2.5
    tp_multiplier: 2.75
    use_dynamic_stops: true

# Trailing stops — disabled because current params were optimized without them.
# Enable for backtesting/optimization experiments only.
trailing_stops:
  enabled: false          # Set true to activate trailing stop logic
  trail_trigger_pct: 0.5  # Start trailing at 50% of TP progress
  trail_lock_pct: 0.5     # Lock in 50% of peak unrealized profit

# Short selling configuration
shorting:
  enabled: true
  min_confirmations: 3

# Trading pairs — ordered by realistic validated performance
# Each pair uses its best-performing interval (4h or 12h)
pairs:
  - AVAX/USD   # 12h — +216%, PF 1.68, DD 13.5%
  - NEAR/USD   # 4h  — +123%, PF 1.27, DD 14.9%
  - ATOM/USD   # 12h — +120%, PF 1.50, DD 17.9%
  - DOT/USD    # 4h  — +114%, PF 1.80, DD 8.1%
  - SOL/USD    # 12h —  +92%, PF 1.30, DD 10.3%
  - ETH/USD    # 4h  —  +69%, PF 1.27, DD 8.6%
  - LINK/USD   # 4h  —  +65%, PF 1.13, DD 13.9%
  - BTC/USD    # 4h  —  +18%, PF 1.19, DD 5.0%
  - XRP/USD    # 4h  —  +14%, PF 1.07, DD 14.3%
  - POL/USD    # 12h —  +11%, PF 1.03, DD 14.0%
