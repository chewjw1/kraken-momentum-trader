# Adaptive pair management — more aggressive re-engagement
adaptive:
  enabled: true
  min_win_rate: 0.15        # Strategy WR is ~30%, don't disable above 15%
  min_profit_factor: 0.3    # Only disable truly terrible pairs
  max_consecutive_losses: 8  # 3 was too aggressive for a 30% WR strategy
  cooldown_hours: 1.0
  reenable_win_rate: 0.45   # 0.50→0.45: lower bar to re-enable (more trading time)

# Position sizing — optimized for shared-capital replay (10 pairs, $10k)
position:
  initial_capital: 10000.0
  size_percent: 20.0        # 20% optimal for shared capital (allows 5 concurrent positions)
  confidence_scaling: false  # Disabled: low WR causes scaling to 0.5x, compounding losses
  min_scale: 0.6
  max_scale: 1.8

# Correlation-aware position limits
# Crypto alts move together — opening 6 longs on alts during a BTC drop
# is effectively one trade. Limit cluster exposure to avoid concentrated risk.
correlation_limits:
  enabled: false   # Tested: hard cluster cap costs ~$2k across 3 quarters
  groups:
    - name: "alt_majors"
      max_positions: 3   # of these correlated alts, max 3 open at once
      pairs:
        - ETH/USD
        - SOL/USD
        - AVAX/USD
        - LINK/USD
        - NEAR/USD
        - DOT/USD
        - ATOM/USD

# Volume regime filter — skip entries when volume is abnormally low
# (typically overnight or low-activity periods produce noise signals)
volume_filter:
  enabled: true
  min_ratio: 0.5            # validated: +$338 across 3 quarters, +$332 on Q1'25
  lookback_candles: 30      # SMA window

# Risk limits
risk:
  # Intra-candle hard loss floor, checked every poll (normal ATR stops are
  # candle-anchored and routinely fill 2x-5x past -5%; worst observed -27.9%).
  # 10% validated in live-fidelity sim: total +$125 over 3 quarters, worst
  # quarter improved -$1,616 -> -$1,037, single-trade loss capped ~-10%.
  # Set 0 to disable.
  disaster_stop_percent: 10.0

# Fees
fees:
  maker_percent: 0.16
  taker_percent: 0.26

# Order execution
execution:
  use_maker_orders: true
  maker_price_offset: 0.0

# Regime detector
regime_detector:
  fast_sma_period: 20
  slow_sma_period: 100
  bull_slope_threshold: 0.02
  bear_slope_threshold: -0.02
  # Re-detect every N committed BTC candles. LOAD-BEARING whipsaw debouncer:
  # per-candle checking turns Q4 2024 replay from +$1,068 into -$595
  # (43 regime flips vs 4). Do not lower without 3-quarter revalidation.
  check_every_candles: 20

# EMA trend filter threshold (filter on/off is controlled per-regime by
# REGIME_ADJUSTMENTS in regime_detector.py, not by config)
ema_filter:
  bearish_threshold: -0.5   # Block longs when EMA trend strength below this %

# Trading loop
trading:
  check_interval_seconds: 60   # 90→60: faster disaster-stop reaction; entries
                               # and normal exits are candle-anchored so poll
                               # frequency does not affect decision count
