# Scalping Strategy Configuration (v5 — 365-day OOS Validated)
# Enhanced with: Stochastic, MACD, OBV, ATR dynamic stops, short selling
# Optimized using 365 days of 4h candles (CryptoCompare) with 70/30 OOS validation
#
# Optimization results (365 days, 4h candles, 150 trials, OOS validated):
#   LINK/USD:  +18.44% (71.4% WR, 125 trades, PF 2.50)  *** TOP ***
#   DOT/USD:   +15.66% (71.0% WR,  99 trades, PF 2.30)  *** TOP ***
#   NEAR/USD:  +12.75% (76.7% WR, 118 trades, PF 2.51)  *** TOP ***
#   AVAX/USD:  +10.90% (75.0% WR, 114 trades, PF 2.29)
#   BTC/USD:    +8.08% (80.8% WR,  94 trades, PF 2.94)
#   XRP/USD:    +7.10% (66.7% WR,  49 trades, PF 2.52)
#   ETH/USD:    +6.64% (69.6% WR, 156 trades, PF 1.47)
#   POL/USD:    +6.32% (76.5% WR,  53 trades, PF 2.34)
#   SOL/USD:    +4.24% (66.7% WR,  38 trades, PF 1.60)
#   ATOM/USD:   +2.96% (62.5% WR,  53 trades, PF 1.62)
#
# All 10 pairs profitable. Data source: CryptoCompare free API.
# Strategy: 8-indicator confirmation with long+short support
# Entry: Buy when 2+ signals confirm oversold, Short when 3+ confirm overbought
# Exit: ATR-based dynamic TP/SL, or indicator reversal

strategy:
  name: "scalping"

  # Default parameters (fallback when per-pair not specified)
  take_profit_percent: 5.5    # Static fallback — ATR dynamic TP preferred
  stop_loss_percent: 3.0      # Static fallback — ATR dynamic SL preferred
  candle_interval: 240        # 4-hour candles
  min_confirmations: 2        # Minimum confirmations for long entry

# Core oscillators
indicators:
  rsi:
    period: 9
    oversold: 30.0
    overbought: 70.0

  stochastic:
    k_period: 15
    d_period: 3
    oversold: 20.0
    overbought: 75.0

  macd:
    fast_period: 12
    slow_period: 26
    signal_period: 9

  bollinger:
    period: 20
    std_dev: 2.0
    squeeze_threshold: 3.0

  vwap:
    threshold_percent: 0.5

  volume:
    spike_threshold: 1.75

  obv:
    sma_period: 20

  atr:
    period: 14
    stop_multiplier: 2.25     # Dynamic SL = 2.25 x ATR
    tp_multiplier: 2.0        # Dynamic TP = 2.0 x ATR
    use_dynamic_stops: true   # Use ATR-based stops instead of static %

# Short selling configuration
shorting:
  enabled: true
  min_confirmations: 3        # Shorts need more confirmation than longs

# Trading pairs — ordered by 365-day OOS-validated performance
pairs:
  - LINK/USD   # TOP — +18.44%, PF 2.50, 125 trades
  - DOT/USD    # TOP — +15.66%, PF 2.30, 99 trades
  - NEAR/USD   # TOP — +12.75%, PF 2.51, 118 trades
  - AVAX/USD   # STRONG — +10.90%, PF 2.29, 114 trades
  - BTC/USD    # STRONG — +8.08%, PF 2.94, 94 trades
  - XRP/USD    # STRONG — +7.10%, PF 2.52, 49 trades
  - ETH/USD    # VIABLE — +6.64%, PF 1.47, 156 trades
  - POL/USD    # VIABLE — +6.32%, PF 2.34, 53 trades
  - SOL/USD    # VIABLE — +4.24%, PF 1.60, 38 trades
