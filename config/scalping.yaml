# Scalping Strategy Configuration (v11 — Q2 2026 OOS-validated, config hygiene)
# Enhanced with: Stochastic, MACD, OBV, ATR dynamic stops, short selling,
#   doji candle filter, disaster stop, trailing stops (available but disabled)
#
# v11 changes (June 2026):
#   - Q2 2026 out-of-sample validation (Apr 1 - Jun 10, pristine data fetched
#     after all parameters were chosen; full bull leg $68k->$82.5k then bear
#     leg to $60k): replay +$264 (+2.6%), live-fidelity -$630. Roughly
#     breakeven through a brutal whipsaw quarter.
#   - Retrain attempt on 3 quarters (Q4'24+Q1'25+Q1'26) validated against Q2:
#     REJECTED. Full 4-pair candidate set cost -$3,041 across 4 quarters in
#     integrated replay (loosened confirmation gates -> excess trading, same
#     failure mode as v10 candidates). Best subset (+$150/4qtrs) was inside
#     the +/-$1k phase-noise band. Params are at their data-supported optimum.
#   - Config hygiene: removed dead circuit_breaker section and
#     order_timeout_seconds; wired previously-dead knobs (ema_filter
#     bearish_threshold, trailing trail_trigger/lock_pct, position
#     confidence_scaling/min/max_scale, regime check_every_candles) —
#     all values match previous hardcodes, behavior-neutral (replay parity
#     verified to the penny).
#   - check_interval 90s -> 60s: faster disaster-stop reaction; entries and
#     normal exits are candle-anchored so decision counts are unaffected.
#
# Validated baselines (integrated replay, $10k, disaster stop 10%):
#   Q4 2024 +$1,068 | Q1 2025 -$1,233 | Q1 2026 +$3,035 | Q2 2026 +$264
# Realistic (live-fidelity, next-open fills):
#   Q1 2026 +$1,777 | Q2 2026 -$630
strategy:
  name: "scalping"

  # Default candle interval (overridden per-pair where needed)
  candle_interval: 240        # 4-hour candles (default)
  take_profit_percent: 4.5    # Static fallback — ATR dynamic TP preferred
  stop_loss_percent: 2.5      # Static fallback — ATR dynamic SL preferred
  min_confirmations: 3        # Minimum confirmations for long entry

# Core oscillators (defaults)
indicators:
  rsi:
    period: 10
    oversold: 28.0
    overbought: 70.0

  stochastic:
    k_period: 13
    d_period: 3
    oversold: 23.0
    overbought: 75.0

  macd:
    fast_period: 12
    slow_period: 26
    signal_period: 9

  bollinger:
    period: 20
    std_dev: 2.0
    squeeze_threshold: 3.0

  vwap:
    threshold_percent: 0.5

  volume:
    spike_threshold: 1.5

  obv:
    sma_period: 20

  atr:
    period: 14
    stop_multiplier: 2.5
    tp_multiplier: 2.75
    use_dynamic_stops: true

# Trailing stops — disabled because current params were optimized without them.
# Enable for backtesting/optimization experiments only.
trailing_stops:
  enabled: false          # Set true to activate trailing stop logic
  trail_trigger_pct: 0.5  # Start trailing at 50% of TP progress
  trail_lock_pct: 0.5     # Lock in 50% of peak unrealized profit

# Short selling configuration
shorting:
  enabled: true
  min_confirmations: 3

# Trading pairs — ordered by realistic validated performance
# Each pair uses its best-performing interval (4h or 12h)
pairs:
