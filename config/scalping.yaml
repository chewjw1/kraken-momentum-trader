# Scalping Strategy Configuration (v9 — Bug-fixed, No Trailing Stops)
# Enhanced with: Stochastic, MACD, OBV, ATR dynamic stops, short selling,
#   doji candle filter, trailing stops (available but disabled)
# Validated with 1-minute execution simulation on 730 days of Kraken OHLCVT data
#
# Bug fixes applied in v9:
#   - CRITICAL: Removed breakeven stop that generated phantom exit prices (+5%
#     above entry via 0.05 buffer bug), inflating returns from +842% to +1440%
#   - CRITICAL: Live trader slope thresholds matched to regime detector (0.02)
#   - CRITICAL: Live trader now loads all per-pair params on startup
#   - HIGH: ATOM/USD ATR TP/SL ratio corrected (was inverted: TP < SL)
#   - HIGH: LINK/USD params reverted to pre-trailing-stop optimization
#   - HIGH: Regime classifier tie-breaking fixed (was always favoring BULL)
#   - MEDIUM: Optimizer trailing stop uses regime-adjusted TP
#   - LOW: segment_by_regime off-by-one dropping last candle
#
# Trailing stops disabled (trailing_stops.enabled: false) because params were
# optimized without them. Enable + re-optimize for trailing stop experiments.
#
# 1-Minute Execution Validated Results (NO trailing stops):
#   AVAX/USD: +216.23% (12h,  90 trades, 54.4% WR, PF 1.68, DD 13.5%)
#   NEAR/USD: +122.51% (4h,  126 trades, 46.8% WR, PF 1.27, DD 14.9%)
#   ATOM/USD: +120.22% (12h,  68 trades, 52.9% WR, PF 1.50, DD 17.9%)
#   DOT/USD:  +113.94% (4h,   63 trades, 57.1% WR, PF 1.80, DD 8.1%)
#   SOL/USD:   +92.39% (12h,  93 trades, 52.7% WR, PF 1.30, DD 10.3%)
#   ETH/USD:   +68.99% (4h,  115 trades, 49.6% WR, PF 1.27, DD 8.6%)
#   LINK/USD:  +65.31% (4h,  154 trades, 49.4% WR, PF 1.13, DD 13.9%)
#   BTC/USD:   +17.80% (4h,   84 trades, 51.2% WR, PF 1.19, DD 5.0%)
#   XRP/USD:   +13.66% (4h,   77 trades, 50.6% WR, PF 1.07, DD 14.3%)
#   POL/USD:   +11.34% (12h, 102 trades, 49.0% WR, PF 1.03, DD 14.0%)
#
# All 10 pairs profitable. Total: +842% over 2 years | Avg: +84%/pair
strategy:
  name: "scalping"

  # Default candle interval (overridden per-pair where needed)
  candle_interval: 240        # 4-hour candles (default)
  take_profit_percent: 4.5    # Static fallback — ATR dynamic TP preferred
  stop_loss_percent: 2.5      # Static fallback — ATR dynamic SL preferred
  min_confirmations: 3        # Minimum confirmations for long entry

# Core oscillators (defaults)
indicators:
  rsi:
    period: 10
    oversold: 28.0
    overbought: 70.0

  stochastic:
    k_period: 13
    d_period: 3
    oversold: 23.0
    overbought: 75.0

  macd:
    fast_period: 12
    slow_period: 26
    signal_period: 9

  bollinger:
    period: 20
    std_dev: 2.0
    squeeze_threshold: 3.0

  vwap:
    threshold_percent: 0.5

  volume:
    spike_threshold: 1.5

  obv:
    sma_period: 20

  atr:
    period: 14
    stop_multiplier: 2.5
    tp_multiplier: 2.75
    use_dynamic_stops: true

# Short selling configuration
shorting:
  enabled: true
  min_confirmations: 3

# Trading pairs — ordered by realistic validated performance
# Each pair uses its best-performing interval (4h or 12h)
pairs:
  - AVAX/USD   # 12h — +216%, PF 1.68, DD 13.5%
  - NEAR/USD   # 4h  — +123%, PF 1.27, DD 14.9%
  - ATOM/USD   # 12h — +120%, PF 1.50, DD 17.9%
  - DOT/USD    # 4h  — +114%, PF 1.80, DD 8.1%
  - SOL/USD    # 12h —  +92%, PF 1.30, DD 10.3%
  - ETH/USD    # 4h  —  +69%, PF 1.27, DD 8.6%
  - LINK/USD   # 4h  —  +65%, PF 1.13, DD 13.9%
  - BTC/USD    # 4h  —  +18%, PF 1.19, DD 5.0%
  - XRP/USD    # 4h  —  +14%, PF 1.07, DD 14.3%
  - POL/USD    # 12h —  +11%, PF 1.03, DD 14.0%
