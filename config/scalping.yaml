# Adaptive pair management — more aggressive re-engagement
adaptive:
  enabled: true
  min_win_rate: 0.15        # Strategy WR is ~30%, don't disable above 15%
  min_profit_factor: 0.3    # Only disable truly terrible pairs
  max_consecutive_losses: 8  # 3 was too aggressive for a 30% WR strategy
  cooldown_hours: 1.0
  reenable_win_rate: 0.45   # 0.50→0.45: lower bar to re-enable (more trading time)

# Position sizing — optimized for shared-capital replay (10 pairs, $10k)
position:
  initial_capital: 10000.0
  size_percent: 20.0        # 20% optimal for shared capital (allows 5 concurrent positions)
  confidence_scaling: false  # Disabled: low WR causes scaling to 0.5x, compounding losses
  min_scale: 0.6
  max_scale: 1.8

# Correlation-aware position limits
# Crypto alts move together — opening 6 longs on alts during a BTC drop
# is effectively one trade. Limit cluster exposure to avoid concentrated risk.
correlation_limits:
  enabled: false   # Tested: hard cluster cap costs ~$2k across 3 quarters
  groups:
    - name: "alt_majors"
      max_positions: 3   # of these correlated alts, max 3 open at once
      pairs:
        - ETH/USD
        - SOL/USD
        - AVAX/USD
        - LINK/USD
        - NEAR/USD
        - DOT/USD
        - ATOM/USD

# Volume regime filter — skip entries when volume is abnormally low
# (typically overnight or low-activity periods produce noise signals)
volume_filter:
  enabled: true
  min_ratio: 0.5            # validated: +$338 across 3 quarters, +$332 on Q1'25
  lookback_candles: 30      # SMA window

# Risk limits
risk:
  # Intra-candle hard loss floor, checked every poll (normal ATR stops are
  # candle-anchored and routinely fill 2x-5x past -5%; worst observed -27.9%).
  # 10% validated in live-fidelity sim: total +$125 over 3 quarters, worst
  # quarter improved -$1,616 -> -$1,037, single-trade loss capped ~-10%.
  # Set 0 to disable.
  disaster_stop_percent: 10.0

# Fees
fees:
  maker_percent: 0.16
  taker_percent: 0.26
  # Kraken margin rollover: charged on OPEN MARGIN positions (shorts only;
  # longs are spot) per started 4h period, as % of notional. Live pays this
  # to the exchange directly; paper/replay now deduct it too so simulated
  # short P&L matches reality (a multi-day short costs ~0.12%/day extra).
  # Set 0 to disable modeling. Kraken's published rate is ~0.01-0.02%/4h.
  margin_rollover_percent_4h: 0.02

# Order execution
execution:
  use_maker_orders: true
  maker_price_offset: 0.0

# Regime detector
regime_detector:
  fast_sma_period: 20
  slow_sma_period: 100
  bull_slope_threshold: 0.02
  bear_slope_threshold: -0.02
  # Re-detect every N committed BTC candles. LOAD-BEARING whipsaw debouncer:
  # per-candle checking turns Q4 2024 replay from +$1,068 into -$595
  # (43 regime flips vs 4). Do not lower without 3-quarter revalidation.
  check_every_candles: 20
  # Block NEW entries for N committed BTC candles after a regime flip
  # (~40h at 10). Pre-registered hypothesis from trade forensics (entries
  # within 20 candles of a flip lost -$2,010 net across 3 quarters),
  # validated on all 4 quarters (integrated replay, $10k):
  #            baseline    cooldown=10   cooldown=20
  #   Q4 2024  +$1,068     +$1,405       +$1,292
  #   Q1 2025  -$1,233     -$217         +$36
  #   Q1 2026  +$3,035     +$3,836       +$1,151
  #   Q2 2026  +$264       -$287         -$481
  #   TOTAL    +$3,134     +$4,736       +$1,998
  # 10 improves 3/4 quarters (+$1,603 total, +51%); the single regression
  # (Q2'26 -$552) is inside the +/-$1k phase-noise band. 20 over-suppresses
  # (kills Q1'26). Exits and open positions are NEVER blocked — only fresh
  # entries. First detection after process start does not count as a flip.
  flip_entry_cooldown_candles: 10

  # Dead-zone / regime entry policy. block_entry_regimes suppresses ALL new
  # entries in the listed regimes ("sit out the chop"); block_short_regimes
  # suppresses only shorts. Exits and open positions are never affected.
  #
  # A/B on the vwap6 baseline (+$4,283) settled the "sit out sideways?"
  # question decisively — sitting out LOSES money, because the strategy
  # already profits from chop (mean-reversion longs + selective shorts):
  #   block_entry sideways  -> +$4,098  (-$185, sideways trading is net +)
  #   block_entry bear      -> +$439    (-$3,844, bear SHORTS are the engine)
  #   block_short sideways  -> +$4,522  (+$239, improves Q1'26, 0 regressions)
  #   block_short bear      -> -$1,548  (-$5,831, catastrophic)
  # Adopted: block SHORTS in sideways only. In a true range, fading
  # overbought is the weak side (ranges break up) and those shorts bleed
  # rollover. Range longs and bear shorts are kept.
  block_entry_regimes: []
  block_short_regimes:
    - sideways

# EMA trend filter threshold (filter on/off is controlled per-regime by
# REGIME_ADJUSTMENTS in regime_detector.py, not by config)
ema_filter:
  bearish_threshold: -0.5   # Block longs when EMA trend strength below this %

# Trading loop
trading:
  check_interval_seconds: 60   # 90→60: faster disaster-stop reaction; entries
                               # and normal exits are candle-anchored so poll
                               # frequency does not affect decision count
