# Scalping Strategy Configuration (v9 — Bug-fixed, Honest Numbers)
# Enhanced with: Stochastic, MACD, OBV, ATR dynamic stops, short selling,
#   trailing stops (trail at 50% of peak above 50% TP), doji candle filter
# Validated with 1-minute execution simulation on 730 days of Kraken OHLCVT data
#
# Bug fixes applied in this version:
#   - CRITICAL: Removed breakeven stop that set phantom exit prices 5% above entry
#     (was generating fake profits via impossible exit prices)
#   - CRITICAL: Live trader slope thresholds matched to regime detector (0.02 not 0.05)
#   - CRITICAL: Live trader now loads all per-pair params on startup (stoch/ATR/short)
#   - HIGH: ATOM/USD ATR TP/SL ratio corrected (was inverted: TP < SL)
#   - HIGH: Regime classifier tie-breaking fixed (was always favoring BULL)
#   - MEDIUM: Optimizer trailing stop now uses regime-adjusted TP
#   - LOW: segment_by_regime off-by-one dropping last candle
#
# 1-Minute Execution Validated Results (HONEST — with corrected trailing):
#   AVAX/USD: +184.23% (12h, 101 trades, 58.4% WR, PF 1.56, DD 15.1%)
#   ATOM/USD: +125.01% (12h,  83 trades, 62.7% WR, PF 1.55, DD 18.3%)
#   NEAR/USD:  +74.69% (4h,  139 trades, 54.7% WR, PF 1.18, DD 15.0%)
#   DOT/USD:   +33.70% (4h,   66 trades, 62.1% WR, PF 1.25, DD 10.7%)
#   ETH/USD:    +9.53% (4h,  132 trades, 55.3% WR, PF 1.04, DD 8.8%)
#   SOL/USD:    +4.93% (12h, 118 trades, 61.0% WR, PF 1.02, DD 16.2%)
#   BTC/USD:    -6.04% (4h,   85 trades, 58.8% WR, PF 0.92, DD 7.0%)
#   XRP/USD:   -11.25% (4h,   80 trades, 62.5% WR, PF 0.93, DD 9.5%)
#   POL/USD:   -22.31% (12h, 123 trades, 56.9% WR, PF 0.94, DD 9.8%)
#   LINK/USD: -192.18% (4h,  455 trades, 36.5% WR, PF 0.78, DD 34.1%)
#
# 6/10 pairs profitable. Total: +200% over 2 years.
# BTC/XRP/POL/LINK need re-optimization with corrected trailing stop logic.
# Previous +1440% figure was WRONG due to phantom breakeven exits.

strategy:
  name: "scalping"

  # Default candle interval (overridden per-pair where needed)
  candle_interval: 240        # 4-hour candles (default)
  take_profit_percent: 4.5    # Static fallback — ATR dynamic TP preferred
  stop_loss_percent: 2.5      # Static fallback — ATR dynamic SL preferred
  min_confirmations: 3        # Minimum confirmations for long entry

# Core oscillators (defaults)
indicators:
  rsi:
    period: 10
    oversold: 28.0
    overbought: 70.0

  stochastic:
    k_period: 13
    d_period: 3
    oversold: 23.0
    overbought: 75.0

  macd:
    fast_period: 12
    slow_period: 26
    signal_period: 9

  bollinger:
    period: 20
    std_dev: 2.0
    squeeze_threshold: 3.0

  vwap:
    threshold_percent: 0.5

  volume:
    spike_threshold: 1.5

  obv:
    sma_period: 20

  atr:
    period: 14
    stop_multiplier: 2.5
    tp_multiplier: 2.75
    use_dynamic_stops: true

# Short selling configuration
shorting:
  enabled: true
  min_confirmations: 3

# Trading pairs — ordered by realistic validated performance
# Each pair uses its best-performing interval (4h or 12h)
pairs:
  - AVAX/USD   # 12h — +184%, PF 1.56, DD 15.1%
  - ATOM/USD   # 12h — +125%, PF 1.55, DD 18.3%
  - NEAR/USD   # 4h  —  +75%, PF 1.18, DD 15.0%
  - DOT/USD    # 4h  —  +34%, PF 1.25, DD 10.7%
  - ETH/USD    # 4h  —  +10%, PF 1.04, DD 8.8%
  - SOL/USD    # 12h —   +5%, PF 1.02, DD 16.2%
  - BTC/USD    # 4h  —   -6%, PF 0.92, DD 7.0% (needs re-opt)
  - XRP/USD    # 4h  —  -11%, PF 0.93, DD 9.5% (needs re-opt)
  - POL/USD    # 12h —  -22%, PF 0.94, DD 9.8% (needs re-opt)
  - LINK/USD   # 4h  — -192%, PF 0.78, DD 34.1% (needs re-opt)

