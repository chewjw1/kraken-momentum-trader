# Adaptive pair management
adaptive:
  enabled: true
  min_win_rate: 0.35
  min_profit_factor: 0.85
  max_consecutive_losses: 3
  cooldown_hours: 2.0
  reenable_win_rate: 0.50

# Position sizing
position:
  initial_capital: 10000.0
  size_percent: 20.0
  confidence_scaling: true
  min_scale: 0.5
  max_scale: 1.5

# Fees
fees:
  maker_percent: 0.16
  taker_percent: 0.26

# Order execution
execution:
  use_maker_orders: true
  maker_price_offset: 0.0
  order_timeout_seconds: 60

# Circuit breaker
circuit_breaker:
  global_max_drawdown_pct: 5.0
  cooldown_hours: 4
  pair_max_drawdown_pct: 2.0
  pair_cooldown_hours: 2.0
  consecutive_loss_limit: 4

# Regime detector
regime_detector:
  fast_sma_period: 50
  slow_sma_period: 200
  bull_slope_threshold: 0.02
  bear_slope_threshold: -0.02

# EMA trend filter
ema_filter:
  enabled: true
  bearish_threshold: -0.5

# Trading loop
trading:
  check_interval_seconds: 120
